# Secret material. The values here are illustrative; real deployments
# should mount from an external secret store (AWS Secrets Manager, GCP
# Secret Manager, HashiCorp Vault) rather than committing them.
apiVersion: v1
kind: Secret
metadata:
  name: proctoring-engine-secret
  namespace: proctoring-engine
type: Opaque
stringData:
  # PostgreSQL DSN. The production database is managed (RDS / Cloud SQL
  # / Neon) and the credentials are stored in the cloud provider's
  # secret store, then synced into this Secret via External Secrets
  # Operator or a similar pattern. The placeholder below documents the
  # shape; the real value never lives in git.
  DATABASE_URL: "postgresql+psycopg://proctoring:REPLACE_ME@proctoring-db.example.com:5432/proctoring"
  # Cloudflare R2 credentials. R2 access keys are scoped to a single
  # bucket and the key pair is rotated at the R2 console. The S3
  # endpoint for R2 is https://<accountid>.r2.cloudflarestorage.com
  S3_ENDPOINT_URL: "https://REPLACE_ME.r2.cloudflarestorage.com"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  # Internal service-to-service credential for the /sessions/{id}/terminate
  # route. This is a shared secret between the API and the fusion engine
  # worker; it is not an LTI-derived token.
  INTERNAL_TERMINATE_TOKEN: "REPLACE_ME"
  # LTI 1.3 tool private key (PEM, base64-encoded). Public keys of the
  # platforms are fetched from each platform's JWKS endpoint at
  # launch-validation time and are not stored here.
  LTI_TOOL_PRIVATE_KEY: "REPLACE_ME_BASE64"
