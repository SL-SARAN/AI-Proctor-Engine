# Horizontal Pod Autoscaler for the worker tier. Scales on CPU under
# the assumption that frame-arrival rate is the dominant signal. The
# upper bound (10) is well below the cluster's available capacity for
# thousands-of-users scale; raise it as the workload grows.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proctoring-engine-worker
  namespace: proctoring-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proctoring-engine-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
