# Non-sensitive configuration. Secret values are in a separate Secret
# resource and never committed to the repository.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proctoring-engine-config
  namespace: proctoring-engine
data:
  # The runtime environment. "production" gates the schema-initialization
  # fast path (no `Base.metadata.create_all`, only Alembic).
  APP_ENV: "production"
  # The async worker concurrency per pod. Tuned to leave headroom for
  # the FastAPI process running alongside in the same pod.
  WORKER_CONCURRENCY: "4"
  # Object storage backend. Cloudflare R2 in production (zero egress
  # fees for evidence-clip traffic). The endpoint URL and keys live in
  # the Secret, not here.
  S3_BUCKET: "proctoring-evidence"
  S3_REGION: "auto"
  # Retention period. Generic per the spec; configure for your
  # jurisdiction. 30 days is a conservative default that does not
  # bake any specific law into the system.
  EVIDENCE_RETENTION_DAYS: "30"
  # The LTI 1.3 platform issuer we trust. In a multi-tenant deployment
  # this is a comma-separated list.
  LTI_ALLOWED_ISSUERS: "https://lms.example.edu"
  # Policy snapshot reference. The session creation endpoint looks up
  # the active PolicyConfig by name; pinning it here as the default.
  POLICY_CONFIG_NAME: "default_v1"
