[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-proctoring-engine"
version = "0.1.0"
description = "Auditable v1 data-model foundation for an AI proctoring engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Proctoring Engine team" }]
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.4,<12",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "webrtcvad-wheels>=2.0,<3",
    # NOTE: face-recognition is intentionally NOT listed here. The naive
    # `face-recognition>=1.3` entry breaks under setuptools>=82 because
    # pip resolves the dependency by distribution name and pulls the broken
    # PyPI `face-recognition-models` package, which uses the removed
    # `pkg_resources` API. The verified install sequence is in the Dockerfile
    # and CI workflow: pip install face_recognition --no-deps, then install
    # the maintained fork face-recognition-models-ng from git pinned to a
    # specific commit hash. See Dockerfile builder stage and CI unit job for
    # the exact commands.
    #
    # Temporary stopgap: keep setuptools pinned below 82 so the
    # face-recognition-models fork's *new* importlib.resources code path
    # isn't blocked by stale wheel metadata in any dev environment that
    # hasn't yet adopted the new install sequence. Remove this once the
    # Docker-first install path is universal.
    "setuptools<82",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24,<1",
    "pytest-httpx>=0.30,<1",
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proctoring_engine"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
