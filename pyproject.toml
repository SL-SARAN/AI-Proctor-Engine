[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-proctoring-engine"
version = "0.1.0"
description = "Auditable v1 data-model foundation for an AI proctoring engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Proctoring Engine team" }]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.4,<12",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "webrtcvad-wheels>=2.0,<3",
    "face-recognition>=1.3,<2; python_version>='3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24,<1",
    "pytest-httpx>=0.30,<1",
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proctoring_engine"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
